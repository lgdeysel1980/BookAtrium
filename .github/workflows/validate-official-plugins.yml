name: Validate official plugins

# Validates official catalogue metadata and source manifests.
# Does not publish releases, upload packages, or require private secrets.

on:
  pull_request:
    paths:
      - "Plugins/Official/**"
      - "registries/**"
      - "docs/plugins/**"
      - "scripts/validate_official_registry.py"
      - "scripts/official_registry_contract.py"
      - "scripts/sync_official_registry_schemas.py"
      - "scripts/verify_official_package_remote.py"
      - "scripts/tests/**"
      - "BookAtrium.PluginContracts/PluginType.cs"
      - "BookAtrium.PluginContracts/PluginCapabilities.cs"
      - "BookAtrium.PluginContracts/MetadataSourceCapabilities.cs"
      - "BookAtrium.PluginContracts/PluginPlatform.cs"
      - "BookAtrium.PluginContracts/ContractApiVersion.cs"
      - ".github/workflows/validate-official-plugins.yml"
  push:
    branches: [main]
    paths:
      - "Plugins/Official/**"
      - "registries/**"
      - "docs/plugins/**"
      - "scripts/validate_official_registry.py"
      - "scripts/official_registry_contract.py"
      - "scripts/sync_official_registry_schemas.py"
      - "scripts/verify_official_package_remote.py"
      - "scripts/tests/**"
      - "BookAtrium.PluginContracts/PluginType.cs"
      - "BookAtrium.PluginContracts/PluginCapabilities.cs"
      - "BookAtrium.PluginContracts/MetadataSourceCapabilities.cs"
      - "BookAtrium.PluginContracts/PluginPlatform.cs"
      - "BookAtrium.PluginContracts/ContractApiVersion.cs"
      - ".github/workflows/validate-official-plugins.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JSON Schema validator and test runner
        run: pip install jsonschema pytest

      - name: Verify baked official registry schemas
        run: |
          test -f registries/schemas/official-contract.json
          test -f registries/schemas/official-index.schema.json
          test -f registries/schemas/official-plugin-manifest.schema.json
          python - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path("registries/schemas/official-contract.json").read_text(encoding="utf-8"))
          assert contract.get("pluginApiVersions") == ["2.0"], contract.get("pluginApiVersions")
          required = {
              "AuthorMetadataSource",
              "FileType",
              "InputProfile",
              "OutputProfile",
              "Store",
          }
          missing = required - set(contract.get("categories") or [])
          assert not missing, f"missing categories in baked contract: {sorted(missing)}"
          print("Baked official contract OK (API 2.0, required categories present).")
          PY

      - name: Validate official registry and plugin metadata
        run: python scripts/validate_official_registry.py

      - name: Run official registry validator unit tests
        run: python -m pytest scripts/tests -q

      - name: Reject latest-download URLs in official metadata
        run: |
          set -euo pipefail
          if grep -RIn --include='*.json' 'releases/latest' Plugins/Official registries; then
            echo "Official plugin metadata must not contain releases/latest URLs" >&2
            exit 1
          fi
          echo "No releases/latest URLs in official JSON metadata."
